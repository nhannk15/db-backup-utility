services:
  mysql:
    image: mysql:8.4
    container_name: bk-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3307:3306"

  postgres:
    image: postgres:16
    container_name: bk-postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"

  mongo:
    image: mongo:7
    container_name: bk-mongo
    ports:
      - "27017:27017"